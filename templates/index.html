<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Delivery Time Prediction</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#ff512f,#dd2476);

}

.container{

width:500px;
padding:40px;
text-align:center;

background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);

border-radius:20px;

box-shadow:0px 10px 30px rgba(0,0,0,0.35);

color:white;

}

h1{

font-size:42px;
margin-bottom:15px;

}

h2{

font-size:28px;
margin-bottom:20px;

}

p{

font-size:18px;
line-height:30px;
margin-bottom:35px;

}

button{

padding:16px 40px;

font-size:20px;

border:none;

border-radius:50px;

background:#FFD93D;

color:#222;

cursor:pointer;

font-weight:bold;

transition:.3s;

}

button:hover{

transform:scale(1.08);

background:#ffffff;

box-shadow:0px 8px 20px rgba(0,0,0,.35);

}

.footer{

margin-top:30px;

font-size:14px;

color:#f5f5f5;

}

</style>

</head>

<body>

<div class="container">

<h1>🍔🍕🍟</h1>

<h2>Are You Hungry? 😋</h2>

<p>

Ready to Predict Your Food Delivery Time?

<br><br>

Let's estimate how quickly your delicious meal will reach your doorstep.

</p>

<a href="/predictdata">

<button>

🚀 Predict Delivery Time

</button>

</a>

<div class="footer">

Made with ❤️ using Machine Learning

</div>

</div>

</body>
</html>
