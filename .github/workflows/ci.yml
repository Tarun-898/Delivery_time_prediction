name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black==25.9.0 flake8==7.3.0

    - name: Check Formatting
      run: black --check .

    - name: Lint
      run: flake8 .

    - name: Build Docker Image
      run: docker build -t delivery_prediction .
    
    - name: Verify Image Contents
      run: |
        docker run --rm delivery_prediction ls -R /app

    - name: Run Docker Container
      run: docker run -d --name app -p 5000:5000 delivery_prediction

    - name: Wait
      run: sleep 15

    - name: Health Check
      run: curl --fail http://localhost:5000 || exit 1

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Image
      run: |
        docker tag delivery_prediction ${{ secrets.DOCKER_IMAGE }}:latest
        docker push ${{ secrets.DOCKER_IMAGE }}:latest

    - name: Cleanup
      if: always()
      run: |
        docker stop app || true
        docker rm app || true


  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3

      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}

        script: |

          sudo docker pull ${{ secrets.DOCKER_IMAGE }}:latest

          sudo docker stop delivery_app || true

          sudo docker rm delivery_app || true

          sudo docker run -d \
            --name delivery_app \
            --restart always \
            -p 5000:5000 \
            ${{ secrets.DOCKER_IMAGE }}:latest