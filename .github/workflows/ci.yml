name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    # ==========================
    # Checkout Repository
    # ==========================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ==========================
    # Setup Python
    # ==========================
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ==========================
    # Upgrade Pip
    # ==========================
    - name: Upgrade Pip
      run: |
        python -m pip install --upgrade pip

    # ==========================
    # Install Dependencies
    # ==========================
    - name: Install Dependencies
      run:
        pip install -r requirements.txt
        pip install black==25.9.0 flake8==7.3.0

    # ==========================
    # Check Code Formatting
    # ==========================
    - name: Check Code Formatting
      run: |
        black --check .

    # ==========================
    # Lint Code
    # ==========================
    - name: Lint Code
      run: |
        flake8 .

    # ==========================
    # Build Docker Image
    # ==========================
    - name: Build Docker Image
      run: |
        docker build -t delivery_prediction .

    # ==========================
    # Run Docker Container
    # ==========================
    - name: Run Docker Container
      run: |
        docker run -d --name app -p 5000:5000 delivery_prediction

    # ==========================
    # Wait for Flask to Start
    # ==========================
    - name: Wait for Application
      run: |
        sleep 10

    # ==========================
    # Check Running Container
    # ==========================
    - name: Check Running Container
      run: |
        docker ps

    # ==========================
    # Show Container Logs
    # ==========================
    - name: Show Container Logs
      run: |
        docker logs app

    # ==========================
    # Health Check
    # ==========================
    - name: Health Check
      run: |
        curl --fail http://localhost:5000/ || exit 1

    # ==========================
    # Stop & Remove Container
    # ==========================
    - name: Cleanup Docker
      if: always()
      run: |
        docker stop app
        docker rm app